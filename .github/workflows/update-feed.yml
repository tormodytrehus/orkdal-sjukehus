name: Oppdater Orkdal-feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orkdal-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hent kilder og bygg RSS
        run: python monitor.py
      - name: Lagre nye treff
        run: |
          git config user.name "orkdal-monitor-bot"
          git config user.email "orkdal-monitor-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Oppdater overvåking"
          git push
